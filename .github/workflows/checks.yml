name: Plugin checks
on:
  push:
  pull_request:
jobs:
  sparrow:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Sparrow provider checks
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/run.ps1
